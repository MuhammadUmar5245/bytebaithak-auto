services:
  worker:
    build: .
    image: bytebaithak-worker:latest
    container_name: bytebaithak-worker
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:8787:8080"   # dashboard: http://localhost:8787 (sirf isi PC par)
    environment:
      - TZ=Asia/Karachi
    volumes:
      - ./data:/app/data        # calendar.csv, posts.db (database), token
      - ./output:/app/output    # har post ki slides, caption aur check report
    command: ["python", "-m", "app.main", "run"]

  # Dashboard ko internet par laata hai: free Cloudflare quick tunnel, https://<random>.trycloudflare.com
  # Link har restart par badalta hai; bot naya link Discord par bhej deta hai.
  # Bina DASHBOARD_PASSWORD ke dashboard bahar se nahi khulta.
  tunnel:
    image: cloudflare/cloudflared:2026.11.0
    container_name: bytebaithak-tunnel
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "--metrics", "0.0.0.0:2000", "--url", "http://worker:8080"]
    depends_on:
      - worker

  # Optional: apne PC par free local AI model (LLM_PROVIDER=ollama).
  # Start: docker compose --profile local-llm up -d
  ollama:
    image: ollama/ollama:0.5.7
    container_name: bytebaithak-ollama
    restart: unless-stopped
    profiles: ["local-llm"]
    volumes:
      - ollama:/root/.ollama

volumes:
  ollama:
